<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile | Miko-Miko Type</title>
    <meta name="description" content="Typing stats, history and friends on Miko-Miko Type." />
    <meta name="theme-color" content="#020e1b" />
    <link rel="icon" href="../public/assets/images/favicon.png" type="image/png" />
    <script>
      try {
        document.documentElement.dataset.theme = localStorage.getItem("mikomiko:theme") || "dark";
        const sidebar = localStorage.getItem("mikomiko:sidebar-collapsed") ?? "false";
        if (sidebar === "true") document.documentElement.classList.add("sidebar-collapsed");
      } catch {}
    </script>
    <link rel="preload" href="../public/assets/fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css" integrity="sha384-6p9AefaqUhEVheRlj1mpAkbngHXy9mbYMrIdcIt4Jlc9lOLIablJq3bBsLOjGwZ7" crossorigin="anonymous" />
    <link rel="stylesheet" href="../public/css/app.css" />
    <script defer src="https://cdn.jsdelivr.net/npm/chart.js@4.4.9/dist/chart.umd.min.js" integrity="sha384-b0GXujLkk9eYYSmcSfoyZbfyElGAQnDyY0skCHSG6w3JgTMFnz11ggrTAr7seu9f" crossorigin="anonymous"></script>
    <script type="module" src="../public/js/pages/profile.js"></script>
  </head>

  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header data-shell></header>

    <main id="main" class="page">
      <div id="profile-root" aria-busy="true">
        <div class="profile-head">
          <div class="skeleton" style="width: 96px; height: 96px; border-radius: 50%"></div>
          <div class="stack" style="gap: 10px">
            <div class="skeleton" style="width: 220px; height: 28px"></div>
            <div class="skeleton" style="width: 160px; height: 16px"></div>
          </div>
        </div>
        <div class="stat-grid">
          <div class="skeleton skeleton-tile"></div>
          <div class="skeleton skeleton-tile"></div>
          <div class="skeleton skeleton-tile"></div>
          <div class="skeleton skeleton-tile"></div>
          <div class="skeleton skeleton-tile"></div>
        </div>
      </div>
    </main>

    <footer class="site-footer">
      <p>Miko-Miko Type, built by Colombe and Mihaja at HEI.</p>
    </footer>
  </body>
</html>
