<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Leaderboard | Miko-Miko Type</title>
    <meta name="description" content="The fastest typists on Miko-Miko Type, updated live." />
    <meta name="theme-color" content="#020e1b" />
    <link rel="icon" href="../public/assets/images/favicon.png" type="image/png" />
    <script>
      try {
        document.documentElement.dataset.theme = localStorage.getItem("mikomiko:theme") || "dark";
      } catch {}
    </script>
    <link rel="preload" href="../public/assets/fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css" integrity="sha384-6p9AefaqUhEVheRlj1mpAkbngHXy9mbYMrIdcIt4Jlc9lOLIablJq3bBsLOjGwZ7" crossorigin="anonymous" />
    <link rel="stylesheet" href="../public/css/app.css" />
    <script type="module" src="../public/js/pages/boards.js"></script>
  </head>

  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header data-shell></header>

    <main id="main" class="page">
      <div class="page-header">
        <div>
          <h1 class="page-title">Leaderboard</h1>
          <p class="page-subtitle">Best result per typist. Updates live as tests finish.</p>
        </div>
        <form id="board-filter" aria-label="Filter by difficulty">
          <fieldset class="segmented">
            <legend class="visually-hidden">Difficulty</legend>
            <label class="chip"><input type="radio" name="difficulty" value="" checked /><span>All</span></label>
            <label class="chip"><input type="radio" name="difficulty" value="easy" /><span>Easy</span></label>
            <label class="chip"><input type="radio" name="difficulty" value="medium" /><span>Medium</span></label>
            <label class="chip"><input type="radio" name="difficulty" value="hard" /><span>Hard</span></label>
          </fieldset>
        </form>
      </div>

      <div class="card board" role="table" aria-label="Leaderboard">
        <div class="board-row board-head" role="row">
          <span role="columnheader">#</span>
          <span role="columnheader">Typist</span>
          <span class="num" role="columnheader">WPM</span>
          <span class="num" role="columnheader">Accuracy</span>
          <span class="num" role="columnheader">Tests</span>
        </div>
        <div id="board-rows" role="rowgroup" aria-live="polite" aria-busy="true"></div>
      </div>

      <div id="board-me"></div>
    </main>

    <footer class="site-footer">
      <p>Miko-Miko Type, built by Colombe and Mihaja at HEI.</p>
    </footer>
  </body>
</html>
