<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Community | Typhoon</title>
    <meta name="description" content="Share results, chat with friends and follow other typists on Typhoon." />
    <meta name="theme-color" content="#0f1216" />
    <link rel="icon" href="../public/assets/images/favicon.svg" type="image/svg+xml" />
    <script>
      try {
        const theme = localStorage.getItem("typhoon:theme");
        if (theme) document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
    <link rel="preload" href="../public/assets/fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css" integrity="sha384-6p9AefaqUhEVheRlj1mpAkbngHXy9mbYMrIdcIt4Jlc9lOLIablJq3bBsLOjGwZ7" crossorigin="anonymous" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/fill/style.css" integrity="sha384-pPVoXE8ft+zxKtxIDDI7SfTK6y95NHm4qa+hKEg/hs8VkjW5IP+9/dGOPCbDpUPl" crossorigin="anonymous" />
    <link rel="stylesheet" href="../public/css/app.css" />
    <script type="module" src="../public/js/pages/community.js"></script>
  </head>

  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header data-shell></header>

    <main id="main" class="page">
      <div class="page-header">
        <div>
          <h1 class="page-title">Community</h1>
          <p class="page-subtitle">Share results, cheer on friends and keep the chat going.</p>
        </div>
      </div>

      <div class="community">
        <section class="feed" aria-label="Feed">
          <div id="composer-slot"></div>
          <button class="btn btn-secondary feed-more" type="button" id="new-posts-btn" hidden></button>
          <div class="feed" id="posts" aria-live="polite" aria-busy="true"></div>
          <button class="btn btn-secondary feed-more" type="button" id="load-more-btn" hidden>Load older posts</button>
        </section>

        <aside class="card side-panel" id="side-panel" aria-label="Chats, inbox and friends"></aside>
      </div>
    </main>

    <footer class="site-footer">
      <p>Typhoon, built by Colombe and Mihaja at HEI.</p>
    </footer>
  </body>
</html>
