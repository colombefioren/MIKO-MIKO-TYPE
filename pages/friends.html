<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Community | Miko-Miko Type</title>
    <meta name="description" content="Share results, chat with friends and follow other typists on Miko-Miko Type." />
    <meta name="theme-color" content="#020e1b" />
    <link rel="icon" href="../public/assets/images/favicon.png" type="image/png" />
    <script>
      try {
        document.documentElement.dataset.theme = localStorage.getItem("mikomiko:theme") || "dark";
        const sidebar = localStorage.getItem("mikomiko:sidebar-collapsed") ?? "false";
        if (sidebar === "true") document.documentElement.classList.add("sidebar-collapsed");
        // Browsers without cross-document view transitions get a fade-in on load instead.
        if (!("onpagereveal" in window)) document.documentElement.classList.add("no-view-transitions");
      } catch {}
    </script>
    <link rel="preload" href="../public/assets/fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css" integrity="sha384-6p9AefaqUhEVheRlj1mpAkbngHXy9mbYMrIdcIt4Jlc9lOLIablJq3bBsLOjGwZ7" crossorigin="anonymous" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/fill/style.css" integrity="sha384-pPVoXE8ft+zxKtxIDDI7SfTK6y95NHm4qa+hKEg/hs8VkjW5IP+9/dGOPCbDpUPl" crossorigin="anonymous" />
    <link rel="stylesheet" href="../public/css/tokens.css" />
    <link rel="stylesheet" href="../public/css/base.css" />
    <link rel="stylesheet" href="../public/css/layout.css" />
    <link rel="stylesheet" href="../public/css/sidebar.css" />
    <link rel="stylesheet" href="../public/css/transitions.css" />
    <link rel="stylesheet" href="../public/css/components/controls.css" />
    <link rel="stylesheet" href="../public/css/components/overlays.css" />
    <link rel="stylesheet" href="../public/css/components/auth-dialog.css" />
    <link rel="stylesheet" href="../public/css/components/content.css" />
    <link rel="stylesheet" href="../public/css/pages/community.css" />
    <script type="module" blocking="render" src="../public/js/ui/shell/boot.js"></script>
    <script type="module" src="../public/js/pages/community.js"></script>
  </head>

  <body data-page="community">
    <a class="skip-link" href="#main">Skip to content</a>
    <header data-shell></header>

    <main id="main" class="page">
      <div class="page-header">
        <div>
          <h1 class="page-title">Community</h1>
          <p class="page-subtitle">Share results, cheer on friends and keep the chat going.</p>
        </div>
      </div>

      <div class="community">
        <section class="feed" aria-label="Feed">
          <div id="composer-slot"></div>
          <button class="btn btn-secondary feed-more" type="button" id="new-posts-btn" hidden></button>
          <div class="feed" id="posts" aria-live="polite" aria-busy="true"></div>
          <button class="btn btn-secondary feed-more" type="button" id="load-more-btn" hidden>Load older posts</button>
        </section>

        <aside class="card side-panel" id="side-panel" aria-label="Chats, inbox and friends"></aside>
      </div>
    </main>

    <footer class="site-footer">
      <p>Miko-Miko Type, built by Colombe and Mihaja at HEI.</p>
    </footer>
  </body>
</html>
